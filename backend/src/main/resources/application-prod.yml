nl2sql:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 86400
    header: Authorization
    prefix: "Bearer "
  aes:
    key: ${AES_KEY}
  sql:
    query-timeout-seconds: 15
    max-rows: 10000
    export-max-rows: 100000
    export-timeout-seconds: 30
  ratelimit:
    sql-exec-per-minute: 1000
  ai:
    auto-mock: false

logging:
  level:
    root: INFO
    com.nl2sql: INFO
    org.hibernate.SQL: WARN
