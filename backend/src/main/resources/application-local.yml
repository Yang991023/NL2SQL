# ===========================================================================
# Local profile
# - 应用库(用户/数据源/元数据)使用本机 docker PostgreSQL (5432)
# - 公司云库**不在这里配置**,而是在「数据源管理」页 UI 添加,
#   密码 AES 加密后存入本机 docker 的 datasource 表,
#   业务查询时由 SqlExecutorService 通过 JDBC 直连
#
# 启动方式:
#   SPRING_PROFILES_ACTIVE=local java -jar target/nl2sql-backend-1.3.0.jar
# ===========================================================================

spring:
  # ---- 应用库(继承 application.yml: localhost:5432/nl2sql) ----
  jpa:
    hibernate:
      ddl-auto: update        # 自动建表(元数据表、审计表)
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public  # 业务元数据默认 public schema
    open-in-view: false

  # ---- Redis(本机 docker) ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  # ---- 保留 redis 自动配置(local 模式要启用) ----
  autoconfigure:
    exclude: []

# ===========================================================================
# 业务配置
# ===========================================================================
nl2sql:
  jwt:
    secret: "ZmFrZS1zZWNyZXQta2V5LWZvci1ubDJzcWwtbXZwLW9ubHktaW5zdGFuY2U="
    expiration-seconds: 86400
    header: Authorization
    prefix: "Bearer "

  aes:
    key: "nl2sql_aes_key_32_bytes_padding_x"

  sql:
    query-timeout-seconds: 15
    max-rows: 10000
    export-max-rows: 100000
    export-timeout-seconds: 30

  # 默认数据源(可为空,启动后在「数据源」页添加)
  default:
    datasource-id: null

  ratelimit:
    sql-exec-per-minute: 30

  # 真实环境 AI 自动 Mock(无真模型时回退)
  ai:
    auto-mock: ${AI_AUTO_MOCK:true}

logging:
  level:
    root: INFO
    com.nl2sql: DEBUG
    org.hibernate.SQL: WARN
